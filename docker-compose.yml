# Запуск: docker compose up -d --build
# Поднимает два контейнера: локальный Telegram Bot API (файлы до 2 ГБ) и самого бота.
services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
    env_file: .env
    environment:
      TELEGRAM_API_URL: http://telegram-bot-api:8081
      DB_PATH: /app/data/bot.db
      TZ: Europe/Moscow
    volumes:
      # общая папка: сервер кладёт туда скачанные файлы, бот их оттуда читает
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      # база данных бота (история, статистика) лежит рядом, в папке data
      - ./data:/app/data

volumes:
  telegram-bot-api-data:
